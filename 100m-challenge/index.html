<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>억억이 프로젝트</title><style>:root{--bg:#07101f;--card:#121c30;--card2:#18263f;--text:#f8faff;--muted:#9caac0;--line:#2a3a59;--good:#4bd69b;--warn:#ffd166;--accent:#7c9cff;--accent2:#b388ff;--danger:#ff6f86}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(124,156,255,.18),transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.eyebrow{font-size:11px;color:var(--accent);font-weight:900;letter-spacing:.1em}h1{font-size:28px;margin:5px 0}.sub,.label,.meta,.note,.detail{color:var(--muted)}.sub{font-size:13px}.sync{padding:8px 10px;border-radius:999px;font-size:11px;font-weight:900;color:var(--warn);background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.25);white-space:nowrap}.sync.online{color:var(--good);background:rgba(75,214,155,.1);border-color:rgba(75,214,155,.25)}.sync.error{color:var(--danger)}.card{background:linear-gradient(145deg,rgba(24,38,63,.96),rgba(14,25,44,.96));border:1px solid rgba(124,156,255,.16);border-radius:24px;padding:19px;margin:13px 0;box-shadow:0 12px 30px rgba(0,0,0,.24)}.name{font-size:22px;font-weight:900}.amount{font-size:35px;font-weight:950;letter-spacing:-.04em;margin:8px 0}.profitRow{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.profitRate{font-size:18px;font-weight:900;color:var(--good)}.progress{height:12px;background:#07101f;border-radius:99px;overflow:hidden;margin:14px 0 8px;border:1px solid var(--line)}.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}.row{display:flex;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:rgba(7,16,31,.46);padding:13px;border-radius:16px;border:1px solid var(--line)}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:6px;font-size:17px}.sectionTitle{font-size:20px;font-weight:900;margin-bottom:14px}.inputGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:13px;margin:0 0 7px 3px}input,select{width:100%;padding:13px 12px;border-radius:14px;border:1px solid var(--line);background:#081222;color:var(--text);font:inherit;font-size:15px}button{width:100%;border:0;border-radius:17px;padding:15px;font:inherit;font-weight:900;font-size:16px}.primary{color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent2));margin-top:14px}.secondary{color:var(--text);background:var(--card2);border:1px solid var(--line);margin-top:9px}.chartHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.chartHead .sectionTitle{margin:0}.rangeTabs{display:flex;gap:5px;padding:4px;background:#081222;border:1px solid var(--line);border-radius:13px}.rangeBtn{width:auto;padding:8px 10px;border-radius:9px;background:transparent;color:var(--muted);font-size:12px}.rangeBtn.active{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff}.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.dotA{background:#7c9cff}.dotB{background:#b388ff}.chartBox{height:270px}canvas{width:100%;height:100%;display:block}.item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.date{font-size:13px;font-weight:800}.gain{font-size:15px;font-weight:900;white-space:nowrap}.good{color:var(--good)}.danger{color:var(--danger)}@media(max-width:430px){.card{padding:17px;border-radius:21px}.amount{font-size:31px}.chartHead{align-items:flex-start;flex-direction:column}.rangeTabs{width:100%}.rangeBtn{flex:1}.chartBox{height:240px}}</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">EOKEOGI PROJECT</div><h1>💰 억억이 프로젝트</h1><div class="sub">매일 한 걸음, 함께 1억까지.</div></div><div id="syncStatus" class="sync">연결 중…</div></div><section class="card"><div class="name">허성은</div><div id="balanceA" class="amount">₩0</div><div class="profitRow"><div id="profitA" class="label good">누적수익 ₩0</div><div id="returnA" class="profitRate">0.00%</div></div><div class="progress"><div id="barA" class="bar"></div></div><div class="row meta"><span id="progressA">0%</span><span id="remainA">남은 금액 ₩0</span></div><div class="grid" style="margin-top:13px"><div class="metric"><span>남은 거래일</span><strong id="daysA">-</strong></div><div class="metric"><span>예상 달성일</span><strong id="dateA">-</strong></div></div></section><section class="card"><div class="name">김도영</div><div id="balanceB" class="amount">₩0</div><div class="profitRow"><div id="profitB" class="label good">누적 실현수익 ₩0</div><div id="returnB" class="profitRate">0.00%</div></div><div class="progress"><div id="barB" class="bar"></div></div><div class="row meta"><span id="progressB">0%</span><span id="remainB">남은 금액 ₩0</span></div><div class="grid" style="margin-top:13px"><div class="metric"><span>남은 거래일</span><strong id="daysB">-</strong></div><div class="metric"><span>예상 달성일</span><strong id="dateB">-</strong></div></div></section><section class="card"><div class="sectionTitle">수익 입력</div><div class="inputGrid"><div class="field"><label>입력자</label><select id="writer" onchange="updateProfitLabel()"><option value="허성은">허성은</option><option value="김도영" selected>김도영</option></select></div><div class="field"><label>날짜</label><input type="date" id="entryDate"></div></div><div class="field" style="margin-top:10px"><label id="profitInputLabel">김도영 수익금</label><input type="number" id="personalGain" inputmode="numeric" placeholder="예: 40000"></div><div class="field" style="margin-top:10px"><label>메모</label><input id="memo" placeholder="예: 당일 실현손익"></div><button class="primary" onclick="addEntry()">내 기록에 추가</button><button class="secondary" onclick="resetApp()">초기값 다시 적용</button></section><section class="card"><div class="chartHead"><div class="sectionTitle" id="chartTitle">최근 7일 누적수익</div><div class="rangeTabs"><button class="rangeBtn" data-range="day" onclick="setRange('day')">하루</button><button class="rangeBtn active" data-range="week" onclick="setRange('week')">일주</button><button class="rangeBtn" data-range="month" onclick="setRange('month')">한달</button></div></div><div class="legend"><span><i class="dot dotA"></i>허성은</span><span><i class="dot dotB"></i>김도영</span></div><div class="chartBox"><canvas id="dailyChart"></canvas></div><div class="note">날짜별 수익을 누적해 표시합니다.</div></section><section class="card"><div class="sectionTitle">개별 업데이트 기록</div><div id="history"></div></section></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyAlTTJG-akfZYXMzGJdPmbz4HXOfa-Ro2w",authDomain:"eokeogi.firebaseapp.com",projectId:"eokeogi",storageBucket:"eokeogi.firebasestorage.app",messagingSenderId:"268722870371",appId:"1:268722870371:web:6f718993fc1cc3292b0056"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),ref=db.collection('app').doc('shared');const GOAL=100000000,RATE=.02,BASE_A=2000000,BASE_B=3894275,$=id=>document.getElementById(id);let entries=[],chartRange='week',ready=false;function todayStr(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);const o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}function weeklyDates(n){const out=[],d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(x.getDate()-i*7);const o=x.getTimezoneOffset();out.push(new Date(x.getTime()-o*60000).toISOString().slice(0,10))}return out}function seedEntries(){const dates=weeklyDates(10),g=[18000,22000,27500,31000,26000,39500,45500,42000,51000,48931],base=dates.map((date,i)=>({date,writer:'김도영',gainA:0,gainB:g[i],memo:'기존 실현수익 배분',seed:true,createdAt:i})),t=todayStr();base.push({date:addDays(t,-1),writer:'허성은',gainA:50000,gainB:0,memo:'어제 수익',seed:true,createdAt:100},{date:t,writer:'허성은',gainA:50000,gainB:0,memo:'오늘 수익',seed:true,createdAt:101});return base}function won(v){const s=v<0?'-':'';return s+'₩'+Math.abs(Math.round(v)).toLocaleString('ko-KR')}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function sum(name){return entries.filter(e=>e.writer===name).reduce((s,e)=>s+Number(name==='허성은'?e.gainA:e.gainB||0),0)}function added(name){return entries.filter(e=>!e.seed&&e.writer===name).reduce((s,e)=>s+Number(name==='허성은'?e.gainA:e.gainB||0),0)}function days(current){if(current>=GOAL)return 0;if(current<=0)return Infinity;return Math.ceil(Math.log(GOAL/current)/Math.log(1+RATE))}function addBiz(start,n){const d=new Date(start);let a=0;while(a<n){d.setDate(d.getDate()+1);if(![0,6].includes(d.getDay()))a++}return d}function setSync(t,c=''){$('syncStatus').textContent=t;$('syncStatus').className='sync '+c}function setPerson(s,b,p,base){const d=days(b),pc=Math.min(100,b/GOAL*100),r=base?p/base*100:0;$('balance'+s).textContent=won(b);$('profit'+s).textContent=(s==='B'?'누적 실현수익 ':'누적수익 ')+won(p);$('return'+s).textContent=(r>=0?'+':'')+r.toFixed(2)+'%';$('return'+s).className='profitRate '+(r>=0?'good':'danger');$('bar'+s).style.width=pc+'%';$('progress'+s).textContent=pc.toFixed(2)+'% 달성';$('remain'+s).textContent='남은 금액 '+won(Math.max(0,GOAL-b));$('days'+s).textContent=isFinite(d)?d+'일':'-';$('date'+s).textContent=isFinite(d)?addBiz(new Date(),d).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'}):'-'}function render(){setPerson('A',BASE_A+sum('허성은'),sum('허성은'),BASE_A);setPerson('B',BASE_B+added('김도영'),sum('김도영'),BASE_B);renderHistory();drawChart()}function renderHistory(){const sorted=[...entries].sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.createdAt)-Number(a.createdAt));$('history').innerHTML=sorted.map(e=>{const amount=e.writer==='허성은'?Number(e.gainA):Number(e.gainB);return `<div class="item"><div><div class="date">${escapeHtml(e.date)} · ${escapeHtml(e.writer)}</div><div class="detail">${escapeHtml(e.memo||'메모 없음')}</div></div><div class="gain ${amount<0?'danger':'good'}">${won(amount)}</div></div>`}).join('')}function chartData(){const back=chartRange==='day'?0:chartRange==='week'?6:29,t=todayStr(),start=addDays(t,-back),map={};for(let i=0;i<=back;i++){const date=addDays(start,i);map[date]={date,label:chartRange==='day'?'오늘':date.slice(5).replace('-','/'),a:0,b:0}}entries.forEach(e=>{if(map[e.date]){map[e.date].a+=Number(e.gainA||0);map[e.date].b+=Number(e.gainB||0)}});let a=0,b=0;return Object.values(map).map(d=>({...d,a:a+=d.a,b:b+=d.b}))}function setRange(r){chartRange=r;document.querySelectorAll('.rangeBtn').forEach(b=>b.classList.toggle('active',b.dataset.range===r));$('chartTitle').textContent=r==='day'?'오늘 누적수익':r==='week'?'최근 7일 누적수익':'최근 30일 누적수익';drawChart()}function drawChart(){const c=$('dailyChart'),box=c.parentElement,dpr=window.devicePixelRatio||1,w=box.clientWidth,h=box.clientHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const data=chartData(),pad={l:52,r:18,t:16,b:42},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,vals=data.flatMap(d=>[d.a,d.b,0]),max=Math.max(...vals),min=Math.min(...vals),range=Math.max(1,max-min),extra=range*.18,yMax=max+extra,yMin=min-extra,y=v=>pad.t+(yMax-v)/(yMax-yMin)*ch,x=i=>pad.l+(data.length===1?cw/2:i*cw/(data.length-1));ctx.font='11px -apple-system,sans-serif';ctx.strokeStyle='#2a3a59';ctx.fillStyle='#9caac0';ctx.textAlign='right';for(let i=0;i<=4;i++){const yy=pad.t+i*ch/4,val=yMax-i*(yMax-yMin)/4;ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();ctx.fillText(Math.round(val/1000)+'K',pad.l-8,yy+4)}ctx.textAlign='center';const labels=Math.min(5,data.length),idx=[];for(let j=0;j<labels;j++)idx.push(labels===1?0:Math.round(j*(data.length-1)/(labels-1)));data.forEach((d,i)=>{if(idx.includes(i))ctx.fillText(d.label,x(i),h-12)});series('a','#7c9cff');series('b','#b388ff');function series(key,color){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2.6;ctx.beginPath();data.forEach((d,i)=>i?ctx.lineTo(x(i),y(d[key])):ctx.moveTo(x(i),y(d[key])));ctx.stroke();data.forEach((d,i)=>{ctx.beginPath();ctx.arc(x(i),y(d[key]),3.5,0,Math.PI*2);ctx.fill()})}}async function save(editor){if(!ready)return;try{await ref.set({entries,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),lastEditor:editor},{merge:true});setSync('실시간 연결','online')}catch(e){console.error(e);setSync('저장 오류','error')}}function updateProfitLabel(){$('profitInputLabel').textContent=$('writer').value+' 수익금'}async function addEntry(){const amount=Number($('personalGain').value||0),name=$('writer').value;if(!amount)return alert('수익 또는 손실 금액을 입력해주세요.');entries.push({date:$('entryDate').value||todayStr(),writer:name,gainA:name==='허성은'?amount:0,gainB:name==='김도영'?amount:0,memo:$('memo').value.trim(),seed:false,createdAt:Date.now()});$('personalGain').value='';$('memo').value='';render();await save(name)}async function resetApp(){if(confirm('초기 수익 데이터로 되돌릴까요?')){entries=seedEntries();render();await save('초기화')}}async function init(){setSync('연결 중…');try{const snap=await ref.get(),d=snap.data()||{};entries=Array.isArray(d.entries)?d.entries:seedEntries();ready=true;render();if(!Array.isArray(d.entries))await save('초기 설정');ref.onSnapshot(s=>{const v=s.data()||{};if(Array.isArray(v.entries)){entries=v.entries;render()}setSync('실시간 연결','online')},()=>setSync('연결 오류','error'))}catch(e){console.error(e);entries=seedEntries();ready=true;render();setSync('연결 오류','error')}}$('entryDate').value=todayStr();updateProfitLabel();window.addEventListener('resize',drawChart);init();</script></body></html>
