<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>억억이 프로젝트</title><style>:root{--bg:#07101f;--card:#121c30;--text:#f8faff;--muted:#9caac0;--line:#2a3a59;--good:#4bd69b;--warn:#ffd166;--accent:#7c9cff;--accent2:#b388ff;--danger:#ff6f86}*{box-sizing:border-box}body{margin:0;background:#07101f;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.wrap{max-width:680px;margin:auto;padding:18px 15px 100px}.top{display:flex;justify-content:space-between;gap:12px}.sync{padding:8px 10px;border-radius:999px;font-size:11px;font-weight:900;color:var(--warn);border:1px solid var(--line)}.sync.online{color:var(--good)}.sync.error{color:var(--danger)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:13px 0}.name{font-size:22px;font-weight:900}.amount{font-size:34px;font-weight:950;margin:8px 0}.label,.meta,.note,.detail{color:var(--muted)}.progress{height:12px;background:#07101f;border-radius:99px;overflow:hidden;margin:14px 0 8px}.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.row{display:flex;justify-content:space-between;gap:10px}.grid,.inputGrid,.stockInputs,.stockStats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric,.stockStat{background:#0a1528;padding:12px;border-radius:14px}.sectionTitle{font-size:20px;font-weight:900;margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}input,select{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:#081222;color:var(--text)}button{width:100%;border:0;border-radius:15px;padding:14px;font-weight:900}.primary{color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent2));margin-top:14px}.secondary{color:var(--text);background:#18263f;margin-top:9px}.chartBox{height:260px}canvas{width:100%;height:100%}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.good{color:var(--good)}.danger{color:var(--danger)}.marketMode{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.modeBtn{background:#081222;color:var(--muted)}.modeBtn.active{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff}.stockCard{padding:15px;border:1px solid var(--line);border-radius:17px;margin-top:12px}.stockTop{display:flex;justify-content:space-between}.signal{font-size:12px;font-weight:900}.portfolioSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.summaryBox{background:#0a1528;padding:10px;text-align:center;border-radius:12px}@media(max-width:430px){.stockInputs,.stockStats{grid-template-columns:1fr 1fr}.portfolioSummary{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><div style="font-size:11px;color:var(--accent);font-weight:900">EOKEOGI PROJECT</div><h1>💰 억억이 프로젝트</h1><div class="label">매일 한 걸음, 함께 1억까지.</div></div><div id="syncStatus" class="sync">연결 중…</div></div><section class="card"><div class="name">허성은</div><div id="balanceA" class="amount">₩0</div><div id="profitA" class="label good">누적수익 ₩0</div><div class="progress"><div id="barA" class="bar"></div></div><div class="row meta"><span id="progressA"></span><span id="remainA"></span></div><div class="grid" style="margin-top:12px"><div class="metric">남은 거래일<strong id="daysA"></strong></div><div class="metric">예상 달성일<strong id="dateA"></strong></div></div></section><section class="card"><div class="name">김도영</div><div id="balanceB" class="amount">₩0</div><div id="profitB" class="label good">누적 실현수익 ₩0</div><div class="progress"><div id="barB" class="bar"></div></div><div class="row meta"><span id="progressB"></span><span id="remainB"></span></div><div class="grid" style="margin-top:12px"><div class="metric">남은 거래일<strong id="daysB"></strong></div><div class="metric">예상 달성일<strong id="dateB"></strong></div></div></section><section class="card"><div class="sectionTitle">📊 포트폴리오 매매 분석</div><div class="marketMode"><button class="modeBtn active" data-mode="bull" onclick="setMarketMode('bull')">🐂 상승장</button><button class="modeBtn" data-mode="neutral" onclick="setMarketMode('neutral')">⚖️ 중립</button><button class="modeBtn" data-mode="bear" onclick="setMarketMode('bear')">🐻 하락장</button></div><div class="field" style="margin-top:12px"><label>보유 현금</label><input id="cashInput" type="number" value="0" oninput="renderPortfolio()"></div><div id="stocks"></div><div class="portfolioSummary"><div class="summaryBox">총 평가액<br><strong id="pfTotal">₩0</strong></div><div class="summaryBox">주식 비중<br><strong id="pfStockWeight">0%</strong></div><div class="summaryBox">현금 비중<br><strong id="pfCashWeight">0%</strong></div></div><button class="primary" onclick="savePortfolio()">포트폴리오 저장</button><div class="note">Firebase 실시간 동기화 적용</div></section><section class="card"><div class="sectionTitle">수익 입력</div><div class="inputGrid"><div class="field"><label>입력자</label><select id="writer" onchange="updateProfitLabel()"><option>허성은</option><option selected>김도영</option></select></div><div class="field"><label>날짜</label><input type="date" id="entryDate"></div></div><div class="field" style="margin-top:10px"><label id="profitInputLabel"></label><input type="number" id="personalGain"></div><div class="field" style="margin-top:10px"><label>메모</label><input id="memo"></div><button class="primary" onclick="addEntry()">내 기록에 추가</button><button class="secondary" onclick="resetApp()">초기값 다시 적용</button></section><section class="card"><div class="sectionTitle">최근 7일 누적수익</div><div class="chartBox"><canvas id="dailyChart"></canvas></div></section><section class="card"><div class="sectionTitle">개별 업데이트 기록</div><div id="history"></div></section></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyAlTTJG-akfZYXMzGJdPmbz4HXOfa-Ro2w",authDomain:"eokeogi.firebaseapp.com",projectId:"eokeogi",storageBucket:"eokeogi.firebasestorage.app",messagingSenderId:"268722870371",appId:"1:268722870371:web:6f718993fc1cc3292b0056"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),ref=db.collection('app').doc('shared');const GOAL=1e8,RATE=.02,BASE_A=2e6,BASE_B=3894275,$=id=>document.getElementById(id);let entries=[],marketMode='bull',ready=false,portfolio={cash:0,stocks:{samsung:{qty:0,avg:0,price:0,budget:0},ocean:{qty:0,avg:0,price:0,budget:0},cable:{qty:0,avg:0,price:0,budget:0},inverse:{qty:0,avg:0,price:0,budget:0}}};const defs=[['samsung','삼성전자'],['ocean','한화오션'],['cable','대한전선'],['inverse','코스피 인버스']],targets={bull:{samsung:40,ocean:23,cable:14,inverse:3},neutral:{samsung:30,ocean:18,cable:9,inverse:13},bear:{samsung:18,ocean:8,cable:4,inverse:20}};function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}function seed(){return [{date:today(),writer:'허성은',gainA:1e5,gainB:0,memo:'초기 수익',seed:true,createdAt:1}]}function won(v){return (v<0?'-':'')+'₩'+Math.abs(Math.round(v)).toLocaleString('ko-KR')}function sum(n){return entries.filter(e=>e.writer===n).reduce((s,e)=>s+Number(n==='허성은'?e.gainA:e.gainB||0),0)}function added(n){return entries.filter(e=>!e.seed&&e.writer===n).reduce((s,e)=>s+Number(n==='허성은'?e.gainA:e.gainB||0),0)}function person(s,b,p){const d=b>0?Math.ceil(Math.log(GOAL/b)/Math.log(1+RATE)):0,pc=Math.min(100,b/GOAL*100);$('balance'+s).textContent=won(b);$('profit'+s).textContent=(s==='B'?'누적 실현수익 ':'누적수익 ')+won(p);$('bar'+s).style.width=pc+'%';$('progress'+s).textContent=pc.toFixed(2)+'% 달성';$('remain'+s).textContent='남은 금액 '+won(Math.max(0,GOAL-b));$('days'+s).textContent=d+'일';$('date'+s).textContent='계산 중'}function setSync(t,c=''){$('syncStatus').textContent=t;$('syncStatus').className='sync '+c}function render(){person('A',BASE_A+sum('허성은'),sum('허성은'));person('B',BASE_B+added('김도영'),sum('김도영'));$('history').innerHTML=[...entries].sort((a,b)=>b.createdAt-a.createdAt).map(e=>`<div class="item"><div>${e.date} · ${e.writer}<div class="detail">${e.memo||''}</div></div><strong class="${(e.writer==='허성은'?e.gainA:e.gainB)<0?'danger':'good'}">${won(e.writer==='허성은'?e.gainA:e.gainB)}</strong></div>`).join('');renderPortfolio();draw()}async function save(editor){if(!ready)return;await ref.set({entries,portfolio:{...portfolio,marketMode},updatedAt:firebase.firestore.FieldValue.serverTimestamp(),lastEditor:editor},{merge:true})}function buildStocks(){$('stocks').innerHTML=defs.map(([id,n])=>`<div class="stockCard"><div class="stockTop"><strong>${n}</strong><span id="${id}Signal" class="signal">HOLD</span></div><div class="stockInputs"><input id="${id}Qty" type="number" placeholder="수량" value="${portfolio.stocks[id]?.qty||0}"><input id="${id}Avg" type="number" placeholder="평단" value="${portfolio.stocks[id]?.avg||0}"><input id="${id}Price" type="number" placeholder="현재가" value="${portfolio.stocks[id]?.price||0}"><input id="${id}Budget" type="number" placeholder="추가매수" value="${portfolio.stocks[id]?.budget||0}"></div><div class="stockStats"><div class="stockStat">비중<strong id="${id}Weight"></strong></div><div class="stockStat">수익률<strong id="${id}Return"></strong></div></div></div>`).join('');$('cashInput').value=portfolio.cash||0}function readPF(){portfolio.cash=Number($('cashInput').value||0);defs.forEach(([id])=>portfolio.stocks[id]={qty:Number($(id+'Qty').value||0),avg:Number($(id+'Avg').value||0),price:Number($(id+'Price').value||0),budget:Number($(id+'Budget').value||0)})}function renderPortfolio(){if(!$('stocks').children.length)return;readPF();let st=0;const vals={};defs.forEach(([id])=>{vals[id]=portfolio.stocks[id].qty*portfolio.stocks[id].price;st+=vals[id]});const total=st+portfolio.cash;defs.forEach(([id])=>{const s=portfolio.stocks[id],w=total?vals[id]/total*100:0,r=s.avg&&s.price?(s.price/s.avg-1)*100:0,t=targets[marketMode][id];$(id+'Weight').textContent=w.toFixed(1)+'% / '+t+'%';$(id+'Return').textContent=r.toFixed(1)+'%';$(id+'Signal').textContent=w<t-5?'BUY':w>t+5?'SELL':'HOLD'});$('pfTotal').textContent=won(total);$('pfStockWeight').textContent=(total?st/total*100:0).toFixed(1)+'%';$('pfCashWeight').textContent=(total?portfolio.cash/total*100:0).toFixed(1)+'%'}function setMarketMode(m){marketMode=m;document.querySelectorAll('.modeBtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));renderPortfolio()}async function savePortfolio(){readPF();await save('포트폴리오');alert('저장했습니다.')}function updateProfitLabel(){$('profitInputLabel').textContent=$('writer').value+' 수익금'}async function addEntry(){const a=Number($('personalGain').value||0),n=$('writer').value;if(!a)return alert('금액을 입력하세요.');entries.push({date:$('entryDate').value||today(),writer:n,gainA:n==='허성은'?a:0,gainB:n==='김도영'?a:0,memo:$('memo').value,seed:false,createdAt:Date.now()});render();await save(n);$('personalGain').value='';$('memo').value=''}async function resetApp(){if(confirm('초기화할까요?')){entries=seed();render();await save('초기화')}}function draw(){const c=$('dailyChart'),x=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;x.scale(d,d);x.clearRect(0,0,w,h);x.strokeStyle='#7c9cff';x.lineWidth=3;x.beginPath();const arr=entries.slice(-7);arr.forEach((e,i)=>{const yy=h-30-(i+1)*20;i?x.lineTo(30+i*(w-60)/Math.max(1,arr.length-1),yy):x.moveTo(30,yy)});x.stroke()}async function init(){setSync('연결 중…');const snap=await ref.get(),d=snap.data()||{};entries=Array.isArray(d.entries)?d.entries:seed();if(d.portfolio){portfolio=d.portfolio;marketMode=d.portfolio.marketMode||'bull'}ready=true;buildStocks();render();if(!Array.isArray(d.entries))await save('초기 설정');ref.onSnapshot(s=>{const v=s.data()||{};if(Array.isArray(v.entries))entries=v.entries;if(v.portfolio){portfolio=v.portfolio;marketMode=v.portfolio.marketMode||'bull'}buildStocks();render();setSync('실시간 연결','online')},()=>setSync('연결 오류','error'))}$('entryDate').value=today();updateProfitLabel();init();window.addEventListener('resize',draw);</script></body></html>
