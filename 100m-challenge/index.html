<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>억억이 프로젝트</title>
<style>
:root{--bg:#07101f;--card:#121c30;--card2:#18263f;--text:#f8faff;--muted:#9caac0;--line:#2a3a59;--good:#4bd69b;--warn:#ffd166;--accent:#7c9cff;--accent2:#b388ff;--danger:#ff6f86}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(124,156,255,.18),transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.eyebrow{font-size:11px;color:var(--accent);font-weight:900;letter-spacing:.1em}h1{font-size:28px;margin:5px 0}.sub,.label,.meta,.note,.detail{color:var(--muted)}.sub{font-size:13px}.sync{padding:8px 10px;border-radius:999px;font-size:11px;font-weight:900;color:var(--warn);background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.25);white-space:nowrap}.sync.online{color:var(--good);background:rgba(75,214,155,.1);border-color:rgba(75,214,155,.25)}.sync.error{color:var(--danger)}.card{background:linear-gradient(145deg,rgba(24,38,63,.96),rgba(14,25,44,.96));border:1px solid rgba(124,156,255,.16);border-radius:24px;padding:19px;margin:13px 0;box-shadow:0 12px 30px rgba(0,0,0,.24)}.name{font-size:22px;font-weight:900}.amount{font-size:35px;font-weight:950;letter-spacing:-.04em;margin:8px 0}.principal{font-size:13px;color:var(--muted);margin-top:-2px;margin-bottom:8px}.profitRow{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.profitRate{font-size:18px;font-weight:900}.progress{height:12px;background:#07101f;border-radius:99px;overflow:hidden;margin:14px 0 8px;border:1px solid var(--line)}.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}.row{display:flex;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:rgba(7,16,31,.46);padding:13px;border-radius:16px;border:1px solid var(--line)}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:6px;font-size:17px}.sectionTitle{font-size:20px;font-weight:900;margin-bottom:14px}.inputGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:13px;margin:0 0 7px 3px}input,select{width:100%;padding:13px 12px;border-radius:14px;border:1px solid var(--line);background:#081222;color:var(--text);font:inherit;font-size:15px}button{border:0;border-radius:14px;padding:11px 13px;font:inherit;font-weight:900}.primary{width:100%;color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent2));margin-top:14px;font-size:16px;padding:15px}.secondary{width:100%;color:var(--text);background:var(--card2);border:1px solid var(--line);margin-top:9px;font-size:16px;padding:15px}.chartHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.chartHead .sectionTitle{margin:0}.rangeTabs{display:flex;gap:5px;padding:4px;background:#081222;border:1px solid var(--line);border-radius:13px}.rangeBtn{padding:8px 10px;border-radius:9px;background:transparent;color:var(--muted);font-size:12px}.rangeBtn.active{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff}.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.dotA{background:#7c9cff}.dotB{background:#b388ff}.chartBox{height:270px}canvas{width:100%;height:100%;display:block}.item{padding:13px 0;border-bottom:1px solid var(--line)}.itemTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.date{font-size:13px;font-weight:800}.gain{font-size:15px;font-weight:900;white-space:nowrap}.good{color:var(--good)}.danger{color:var(--danger)}.itemActions{display:flex;gap:8px;margin-top:10px}.mini{flex:1;background:#0b1628;color:var(--text);border:1px solid var(--line);font-size:13px}.mini.dangerBtn{color:var(--danger)}.editBox{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(7,16,31,.55)}.hidden{display:none}.editActions{display:flex;gap:8px}.editActions button{flex:1;margin-top:10px}.saveBtn{background:linear-gradient(100deg,var(--accent),var(--accent2));color:white}.cancelBtn{background:var(--card2);color:var(--text);border:1px solid var(--line)}
@media(max-width:430px){.card{padding:17px;border-radius:21px}.amount{font-size:31px}.chartHead{align-items:flex-start;flex-direction:column}.rangeTabs{width:100%}.rangeBtn{flex:1}.chartBox{height:240px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="eyebrow">EOKEOGI PROJECT</div><h1>💰 억억이 프로젝트</h1><div class="sub">매일 한 걸음, 함께 1억까지.</div></div><div id="syncStatus" class="sync">연결 중…</div></div>
<section class="card"><div class="name">허성은</div><div id="balanceA" class="amount">₩0</div><div id="principalA" class="principal">원금 ₩0</div><div class="profitRow"><div id="profitA" class="label good">누적수익 ₩0</div><div id="returnA" class="profitRate">0.00%</div></div><div class="progress"><div id="barA" class="bar"></div></div><div class="row meta"><span id="progressA">0%</span><span id="remainA">남은 금액 ₩0</span></div><div class="grid" style="margin-top:13px"><div class="metric"><span>남은 거래일</span><strong id="daysA">-</strong></div><div class="metric"><span>예상 달성일</span><strong id="dateA">-</strong></div></div></section>
<section class="card"><div class="name">김도영</div><div id="balanceB" class="amount">₩0</div><div id="principalB" class="principal">원금 ₩0</div><div class="profitRow"><div id="profitB" class="label good">누적 실현수익 ₩0</div><div id="returnB" class="profitRate">0.00%</div></div><div class="progress"><div id="barB" class="bar"></div></div><div class="row meta"><span id="progressB">0%</span><span id="remainB">남은 금액 ₩0</span></div><div class="grid" style="margin-top:13px"><div class="metric"><span>남은 거래일</span><strong id="daysB">-</strong></div><div class="metric"><span>예상 달성일</span><strong id="dateB">-</strong></div></div></section>
<section class="card"><div class="sectionTitle">수익 입력</div><div class="inputGrid"><div class="field"><label>입력자</label><select id="writer" onchange="updateProfitLabel()"><option value="허성은">허성은</option><option value="김도영" selected>김도영</option></select></div><div class="field"><label>날짜</label><input type="date" id="entryDate"></div></div><div class="field" style="margin-top:10px"><label id="profitInputLabel">김도영 수익금</label><input type="number" id="personalGain" inputmode="numeric" placeholder="예: 40000"></div><div class="field" style="margin-top:10px"><label>메모</label><input id="memo" placeholder="예: 당일 실현손익"></div><button class="primary" onclick="addEntry()">내 기록에 추가</button><button class="secondary" onclick="resetApp()">초기값 다시 적용</button></section>
<section class="card"><div class="chartHead"><div class="sectionTitle" id="chartTitle">최근 7일 누적수익</div><div class="rangeTabs"><button class="rangeBtn" data-range="day" onclick="setRange('day')">하루</button><button class="rangeBtn active" data-range="week" onclick="setRange('week')">일주</button><button class="rangeBtn" data-range="month" onclick="setRange('month')">한달</button></div></div><div class="legend"><span><i class="dot dotA"></i>허성은</span><span><i class="dot dotB"></i>김도영</span></div><div class="chartBox"><canvas id="dailyChart"></canvas></div><div class="note">김도영 기존 누적 실현수익은 최근 6거래일에 나누어 그래프에 반영합니다.</div></section>
<section class="card"><div class="sectionTitle">개별 업데이트 기록</div><div id="history"></div></section>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAlTTJG-akfZYXMzGJdPmbz4HXOfa-Ro2w",authDomain:"eokeogi.firebaseapp.com",projectId:"eokeogi",storageBucket:"eokeogi.firebasestorage.app",messagingSenderId:"268722870371",appId:"1:268722870371:web:6f718993fc1cc3292b0056"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(),ref=db.collection('app').doc('shared');
const GOAL=100000000,RATE=.02,PRINCIPAL_A=2000000,PRINCIPAL_B=3542844,INITIAL_B_PROFIT=351431,$=id=>document.getElementById(id);
let entries=[],chartRange='week',ready=false;
function todayStr(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);const o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}
function recentBizDates(n){const out=[],d=new Date();while(out.length<n){if(![0,6].includes(d.getDay())){const o=d.getTimezoneOffset();out.unshift(new Date(d.getTime()-o*60000).toISOString().slice(0,10))}d.setDate(d.getDate()-1)}return out}
function baseEntries(){const t=todayStr();return[{id:'seed-a-1',date:addDays(t,-1),writer:'허성은',gainA:50000,gainB:0,memo:'어제 수익',seed:true,createdAt:100},{id:'seed-a-2',date:t,writer:'허성은',gainA:50000,gainB:0,memo:'오늘 수익',seed:true,createdAt:101}]}
function bSplitEntries(){const dates=recentBizDates(6),q=Math.floor(INITIAL_B_PROFIT/6),rem=INITIAL_B_PROFIT-q*6;return dates.map((date,i)=>({id:'seed-b-'+i,date,writer:'김도영',gainA:0,gainB:q+(i<rem?1:0),memo:'기존 누적 실현수익 6거래일 배분',seed:true,createdAt:200+i}))}
function seedEntries(){return[...baseEntries(),...bSplitEntries()]}
function normalizeEntries(src){const arr=(Array.isArray(src)?src:[]).map((e,i)=>({...e,id:e.id||('legacy-'+(e.createdAt||Date.now())+'-'+i)}));const keep=arr.filter(e=>!(e.writer==='김도영'&&e.seed&&(e.memo==='기존 실현수익 배분'||e.memo==='기존 누적 실현수익 기준 반영'||e.memo==='기존 누적 실현수익 6거래일 배분')));return[...keep,...bSplitEntries()]}
function won(v){const s=v<0?'-':'';return s+'₩'+Math.abs(Math.round(v)).toLocaleString('ko-KR')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sum(name){return entries.filter(e=>e.writer===name).reduce((s,e)=>s+Number(name==='허성은'?e.gainA:e.gainB||0),0)}
function days(current){if(current>=GOAL)return 0;if(current<=0)return Infinity;return Math.ceil(Math.log(GOAL/current)/Math.log(1+RATE))}
function addBiz(start,n){const d=new Date(start);let a=0;while(a<n){d.setDate(d.getDate()+1);if(![0,6].includes(d.getDay()))a++}return d}
function setSync(t,c=''){$('syncStatus').textContent=t;$('syncStatus').className='sync '+c}
function setPerson(s,b,p,principal){const d=days(b),pc=Math.min(100,b/GOAL*100),r=principal?p/principal*100:0;$('balance'+s).textContent=won(b);$('principal'+s).textContent='원금 '+won(principal);$('profit'+s).textContent=(s==='B'?'누적 실현수익 ':'누적수익 ')+won(p);$('return'+s).textContent=(r>=0?'+':'')+r.toFixed(2)+'%';$('return'+s).className='profitRate '+(r>=0?'good':'danger');$('bar'+s).style.width=pc+'%';$('progress'+s).textContent=pc.toFixed(2)+'% 달성';$('remain'+s).textContent='남은 금액 '+won(Math.max(0,GOAL-b));$('days'+s).textContent=isFinite(d)?d+'일':'-';$('date'+s).textContent=isFinite(d)?addBiz(new Date(),d).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'}):'-'}
function render(){setPerson('A',PRINCIPAL_A+sum('허성은'),sum('허성은'),PRINCIPAL_A);setPerson('B',PRINCIPAL_B+sum('김도영'),sum('김도영'),PRINCIPAL_B);renderHistory();drawChart()}
function renderHistory(){const sorted=[...entries].sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.createdAt)-Number(a.createdAt));$('history').innerHTML=sorted.map(e=>{const amount=e.writer==='허성은'?Number(e.gainA):Number(e.gainB);const id=escapeHtml(e.id);return `<div class="item"><div class="itemTop"><div><div class="date">${escapeHtml(e.date)} · ${escapeHtml(e.writer)}</div><div class="detail">${escapeHtml(e.memo||'메모 없음')}</div></div><div class="gain ${amount<0?'danger':'good'}">${won(amount)}</div></div><div class="itemActions"><button class="mini" onclick="toggleEdit('${id}')">수정</button><button class="mini dangerBtn" onclick="deleteEntry('${id}')">삭제</button></div><div id="edit-${id}" class="editBox hidden"><div class="inputGrid"><div class="field"><label>입력자</label><select id="ew-${id}"><option value="허성은" ${e.writer==='허성은'?'selected':''}>허성은</option><option value="김도영" ${e.writer==='김도영'?'selected':''}>김도영</option></select></div><div class="field"><label>날짜</label><input type="date" id="ed-${id}" value="${escapeHtml(e.date)}"></div></div><div class="field" style="margin-top:10px"><label>수익금</label><input type="number" inputmode="numeric" id="eg-${id}" value="${amount}"></div><div class="field" style="margin-top:10px"><label>메모</label><input id="em-${id}" value="${escapeHtml(e.memo||'')}"></div><div class="editActions"><button class="saveBtn" onclick="saveEdit('${id}')">저장</button><button class="cancelBtn" onclick="toggleEdit('${id}',false)">취소</button></div></div></div>`}).join('')}
function toggleEdit(id,force){const el=$('edit-'+id);if(!el)return;const show=typeof force==='boolean'?force:el.classList.contains('hidden');el.classList.toggle('hidden',!show)}
async function saveEdit(id){const idx=entries.findIndex(e=>e.id===id);if(idx<0)return;const writer=$('ew-'+id).value,date=$('ed-'+id).value,gain=Number($('eg-'+id).value),memo=$('em-'+id).value.trim();if(!date||!Number.isFinite(gain)){alert('날짜와 금액을 확인해 주세요.');return}entries[idx]={...entries[idx],writer,date,gainA:writer==='허성은'?gain:0,gainB:writer==='김도영'?gain:0,memo,seed:false,updatedAt:Date.now()};await save();render()}
async function deleteEntry(id){const e=entries.find(x=>x.id===id);if(!e)return;if(!confirm('이 기록을 삭제할까요?'))return;entries=entries.filter(x=>x.id!==id);await save();render()}
function chartData(){const back=chartRange==='day'?0:chartRange==='week'?6:29,t=todayStr(),start=addDays(t,-back),map={};for(let i=0;i<=back;i++){const date=addDays(start,i);map[date]={date,label:chartRange==='day'?'오늘':date.slice(5).replace('-','/'),a:0,b:0}}entries.forEach(e=>{if(map[e.date]){map[e.date].a+=Number(e.gainA||0);map[e.date].b+=Number(e.gainB||0)}});let ca=entries.filter(e=>e.date<start).reduce((s,e)=>s+Number(e.gainA||0),0),cb=entries.filter(e=>e.date<start).reduce((s,e)=>s+Number(e.gainB||0),0);return Object.values(map).map(x=>{ca+=x.a;cb+=x.b;return{...x,a:ca,b:cb}})}
function drawChart(){const c=$('dailyChart'),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const data=chartData();if(!data.length)return;const vals=data.flatMap(x=>[x.a,x.b]),min=Math.min(0,...vals),max=Math.max(1,...vals),pad=28,iw=w-pad*2,ih=h-pad*2;ctx.strokeStyle='#2a3a59';ctx.lineWidth=1;for(let i=0;i<4;i++){const y=pad+ih*i/3;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}function path(key,color){ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();data.forEach((x,i)=>{const px=data.length===1?w/2:pad+iw*i/(data.length-1),py=pad+ih-(x[key]-min)/(max-min)*ih;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke()}path('a','#7c9cff');path('b','#b388ff');ctx.fillStyle='#9caac0';ctx.font='11px sans-serif';data.forEach((x,i)=>{if(data.length<=8||i%5===0||i===data.length-1){const px=data.length===1?w/2:pad+iw*i/(data.length-1);ctx.fillText(x.label,Math.max(2,px-14),h-7)}})}
function setRange(r){chartRange=r;document.querySelectorAll('.rangeBtn').forEach(b=>b.classList.toggle('active',b.dataset.range===r));$('chartTitle').textContent=r==='day'?'오늘 누적수익':r==='week'?'최근 7일 누적수익':'최근 30일 누적수익';drawChart()}
function updateProfitLabel(){$('profitInputLabel').textContent=$('writer').value+' 수익금'}
async function addEntry(){const writer=$('writer').value,date=$('entryDate').value,gain=Number($('personalGain').value),memo=$('memo').value.trim();if(!date||!Number.isFinite(gain)){alert('날짜와 금액을 확인해 주세요.');return}entries.push({id:'e-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),date,writer,gainA:writer==='허성은'?gain:0,gainB:writer==='김도영'?gain:0,memo,createdAt:Date.now()});$('personalGain').value='';$('memo').value='';await save();render()}
async function save(){try{setSync('저장 중…');await ref.set({entries,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});setSync('동기화됨','online')}catch(err){console.error(err);setSync('저장 실패','error');alert('저장에 실패했습니다. 인터넷 연결을 확인해 주세요.')}}
async function resetApp(){if(!confirm('모든 기록을 초기값으로 되돌릴까요?'))return;entries=seedEntries();await save();render()}
ref.onSnapshot(async snap=>{try{if(!snap.exists){entries=seedEntries();await save()}else{entries=normalizeEntries(snap.data().entries);render();setSync('동기화됨','online')}ready=true}catch(err){console.error(err);setSync('불러오기 실패','error')}} ,err=>{console.error(err);setSync('연결 오류','error')});
$('entryDate').value=todayStr();updateProfitLabel();window.addEventListener('resize',drawChart);
</script>
</body>
</html>
