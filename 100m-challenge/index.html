<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>억억이 프로젝트</title><style>
:root{--bg:#07101f;--card:#121c30;--card2:#18263f;--text:#f8faff;--muted:#9caac0;--line:#2a3a59;--good:#4bd69b;--warn:#ffd166;--accent:#7c9cff;--accent2:#b388ff;--danger:#ff6f86;--shadow:0 12px 30px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(124,156,255,.20),transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:18px 15px 100px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.eyebrow{font-size:11px;color:var(--accent);font-weight:900;letter-spacing:.1em}h1{font-size:29px;margin:5px 0}.sub,.label,.meta,.note,.detail{color:var(--muted)}.sub{font-size:13px}.sync{padding:8px 10px;border-radius:999px;font-size:11px;font-weight:900;color:var(--good);background:rgba(75,214,155,.12);border:1px solid rgba(75,214,155,.28)}.card{background:linear-gradient(145deg,rgba(24,38,63,.96),rgba(14,25,44,.96));border:1px solid rgba(124,156,255,.16);border-radius:24px;padding:20px;margin:13px 0;box-shadow:var(--shadow)}.personCard{position:relative;overflow:hidden}.personCard:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-70px;top:-75px;background:rgba(124,156,255,.10)}.name{font-size:22px;font-weight:900}.amount{font-size:35px;font-weight:950;letter-spacing:-.04em;margin:8px 0}.label{font-size:13px}.good{color:var(--good)}.warn{color:var(--warn)}.progress{height:12px;background:#07101f;border-radius:99px;overflow:hidden;margin:14px 0 8px;border:1px solid var(--line)}.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.meta{font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:rgba(7,16,31,.42);padding:13px;border-radius:16px;border:1px solid var(--line)}.metric strong{display:block;font-size:17px;margin-top:7px}.sectionTitle{font-size:20px;font-weight:900;margin-bottom:15px}.inputGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:13px;margin:0 0 7px 3px}input,select{width:100%;padding:15px 14px;border-radius:16px;border:1px solid var(--line);background:#081222;color:var(--text);font:inherit;font-size:16px}button{width:100%;border:0;border-radius:17px;padding:16px;font:inherit;font-weight:900;font-size:16px}.primary{color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent2));margin-top:16px}.secondary{color:var(--text);background:var(--card2);border:1px solid var(--line);margin-top:10px}.note{font-size:12px;line-height:1.55;margin-top:13px}.chartHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.chartHead .sectionTitle{margin:0}.rangeTabs{display:flex;gap:6px;background:#081222;border:1px solid var(--line);padding:4px;border-radius:14px}.rangeBtn{width:auto;padding:8px 11px;border-radius:10px;background:transparent;color:var(--muted);font-size:12px}.rangeBtn.active{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff}.chartBox{height:280px;position:relative}.legend{display:flex;gap:15px;font-size:12px;color:var(--muted);margin-bottom:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.dotA{background:#7c9cff}.dotB{background:#b388ff}canvas{width:100%;height:100%;display:block}.item{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.date{font-size:13px;font-weight:800}.detail{font-size:12px;margin-top:4px}.gain{font-size:15px;font-weight:900;white-space:nowrap}@media(max-width:430px){.wrap{padding-left:12px;padding-right:12px}.card{padding:17px;border-radius:21px}.amount{font-size:31px}.chartBox{height:245px}.chartHead{align-items:flex-start;flex-direction:column}.rangeTabs{width:100%}.rangeBtn{flex:1}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="eyebrow">EOKEOGI PROJECT</div><h1>💰 억억이 프로젝트</h1><div class="sub">매일 한 걸음, 함께 1억까지.</div></div><div class="sync">이 기기에 저장</div></div>
<section class="card personCard"><div class="name">허성은</div><div id="balanceA" class="amount">₩0</div><div id="profitA" class="label good">누적수익 ₩0</div><div class="progress"><div id="barA" class="bar"></div></div><div class="row meta"><span id="progressA">0%</span><span id="remainA">남은 금액 ₩0</span></div><div class="grid" style="margin-top:13px"><div class="metric"><span class="label">남은 거래일</span><strong id="daysA" class="warn">-</strong></div><div class="metric"><span class="label">예상 달성일</span><strong id="dateA">-</strong></div></div></section>
<section class="card personCard"><div class="name">김도영</div><div id="balanceB" class="amount">₩0</div><div id="profitB" class="label good">누적 실현수익 ₩0</div><div class="progress"><div id="barB" class="bar"></div></div><div class="row meta"><span id="progressB">0%</span><span id="remainB">남은 금액 ₩0</span></div><div class="grid" style="margin-top:13px"><div class="metric"><span class="label">남은 거래일</span><strong id="daysB" class="warn">-</strong></div><div class="metric"><span class="label">예상 달성일</span><strong id="dateB">-</strong></div></div></section>
<section class="card"><div class="sectionTitle">수익 입력</div><div class="inputGrid"><div class="field"><label>입력자</label><select id="writer" onchange="updateProfitLabel()"><option value="허성은">허성은</option><option value="김도영" selected>김도영</option></select></div><div class="field"><label>날짜</label><input type="date" id="entryDate"></div></div><div class="field" style="margin-top:10px"><label id="profitInputLabel">김도영 수익금</label><input type="number" id="personalGain" inputmode="numeric" placeholder="예: 40000"></div><div class="field" style="margin-top:10px"><label>메모</label><input id="memo" placeholder="예: 당일 실현손익"></div><button class="primary" onclick="addEntry()">내 기록에 추가</button><button class="secondary" onclick="resetApp()">초기값 다시 적용</button></section>
<section class="card"><div class="chartHead"><div class="sectionTitle" id="chartTitle">최근 7일 수익</div><div class="rangeTabs"><button class="rangeBtn" data-range="day" onclick="setRange('day')">하루</button><button class="rangeBtn active" data-range="week" onclick="setRange('week')">일주</button><button class="rangeBtn" data-range="month" onclick="setRange('month')">한달</button></div></div><div class="legend"><span><i class="dot dotA"></i>허성은</span><span><i class="dot dotB"></i>김도영</span></div><div class="chartBox"><canvas id="dailyChart"></canvas></div><div class="note" id="chartNote">모든 데이터 점은 유지하고 날짜 숫자만 최대 5개 표시합니다.</div></section>
<section class="card"><div class="sectionTitle">개별 업데이트 기록</div><div id="history"></div></section></div>
<script>
const GOAL=100000000,DAILY_RATE=.02,BASE_A=2000000,BASE_B=3894275,LOCAL_KEY='eokeogi_v6';let entries=[],chartRange='week';const $=id=>document.getElementById(id);
function todayStr(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);const o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}
function weeklyDates(n){const out=[],d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(x.getDate()-i*7);const o=x.getTimezoneOffset();out.push(new Date(x.getTime()-o*60000).toISOString().slice(0,10))}return out}
function seedEntries(){const dates=weeklyDates(10),gains=[18000,22000,27500,31000,26000,39500,45500,42000,51000,48931],base=dates.map((date,i)=>({date,writer:'김도영',gainA:0,gainB:gains[i],memo:'기존 실현수익 배분',seed:true,createdAt:i}));const t=todayStr();base.push({date:addDays(t,-1),writer:'허성은',gainA:50000,gainB:0,memo:'어제 수익',seed:true,createdAt:100});base.push({date:t,writer:'허성은',gainA:50000,gainB:0,memo:'오늘 수익',seed:true,createdAt:101});return base}
function won(v){const s=v<0?'-':'';return s+'₩'+Math.abs(Math.round(v)).toLocaleString('ko-KR')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function load(){try{const x=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');return Array.isArray(x)?x:seedEntries()}catch{return seedEntries()}}
function save(){localStorage.setItem(LOCAL_KEY,JSON.stringify(entries))}
function sum(name){return entries.filter(e=>e.writer===name).reduce((s,e)=>s+Number(name==='허성은'?e.gainA:e.gainB||0),0)}
function added(name){return entries.filter(e=>!e.seed&&e.writer===name).reduce((s,e)=>s+Number(name==='허성은'?e.gainA:e.gainB||0),0)}
function days(current){if(current>=GOAL)return 0;if(current<=0)return Infinity;return Math.ceil(Math.log(GOAL/current)/Math.log(1+DAILY_RATE))}
function addBiz(start,n){const d=new Date(start);let a=0;while(a<n){d.setDate(d.getDate()+1);if(![0,6].includes(d.getDay()))a++}return d}
function setPerson(s,b,pf){const d=days(b),p=Math.min(100,b/GOAL*100);$('balance'+s).textContent=won(b);$('profit'+s).textContent=(s==='B'?'누적 실현수익 ':'누적수익 ')+won(pf);$('bar'+s).style.width=p+'%';$('progress'+s).textContent=p.toFixed(2)+'% 달성';$('remain'+s).textContent='남은 금액 '+won(Math.max(0,GOAL-b));$('days'+s).textContent=isFinite(d)?d+'일':'계산 불가';$('date'+s).textContent=isFinite(d)?addBiz(new Date(),d).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'}):'-'}
function render(){setPerson('A',BASE_A+sum('허성은'),sum('허성은'));setPerson('B',BASE_B+added('김도영'),sum('김도영'));renderHistory();drawChart()}
function renderHistory(){const sorted=[...entries].sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.createdAt)-Number(a.createdAt));$('history').innerHTML=sorted.map(e=>{const amount=e.writer==='허성은'?Number(e.gainA):Number(e.gainB);return `<div class="item"><div><div class="date">${escapeHtml(e.date)} · ${e.writer}</div><div class="detail">${escapeHtml(e.memo||'메모 없음')}</div></div><div class="gain" style="color:${amount<0?'var(--danger)':'var(--good)'}">${won(amount)}</div></div>`}).join('')}
function chartData(){const daysBack=chartRange==='day'?0:chartRange==='week'?6:29,t=todayStr(),start=addDays(t,-daysBack),map={};for(let i=0;i<=daysBack;i++){const date=addDays(start,i);map[date]={date,label:chartRange==='day'?'오늘':date.slice(5).replace('-','/'),a:0,b:0}}entries.forEach(e=>{if(e.date>=start&&e.date<=t&&map[e.date]){map[e.date].a+=Number(e.gainA||0);map[e.date].b+=Number(e.gainB||0)}});return Object.values(map)}
function setRange(r){chartRange=r;document.querySelectorAll('.rangeBtn').forEach(b=>b.classList.toggle('active',b.dataset.range===r));$('chartTitle').textContent=r==='day'?'오늘 수익':r==='week'?'최근 7일 수익':'최근 30일 수익';drawChart()}
function smoothPath(ctx,pts){if(!pts.length)return;ctx.moveTo(pts[0].x,pts[0].y);for(let i=0;i<pts.length-1;i++){const p=pts[i],n=pts[i+1],mx=(p.x+n.x)/2;ctx.quadraticCurveTo(p.x,p.y,mx,(p.y+n.y)/2)}const l=pts[pts.length-1];ctx.lineTo(l.x,l.y)}
function drawChart(){const c=$('dailyChart'),box=c.parentElement,dpr=window.devicePixelRatio||1,w=box.clientWidth,h=box.clientHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const data=chartData(),pad={l:52,r:18,t:16,b:44},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,vals=data.flatMap(d=>[d.a,d.b,0]),max=Math.max(...vals),min=Math.min(...vals),range=Math.max(1,max-min),extra=range*.18,yMax=max+extra,yMin=min-extra,y=v=>pad.t+(yMax-v)/(yMax-yMin)*ch,x=i=>pad.l+(data.length===1?cw/2:i*cw/(data.length-1));ctx.font='11px -apple-system,sans-serif';ctx.strokeStyle='#2a3a59';ctx.fillStyle='#9caac0';ctx.textAlign='right';for(let i=0;i<=4;i++){const yy=pad.t+i*ch/4,val=yMax-i*(yMax-yMin)/4;ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();ctx.fillText(Math.round(val/1000)+'K',pad.l-8,yy+4)}ctx.textAlign='center';const labelCount=Math.min(5,data.length),idx=[];for(let j=0;j<labelCount;j++)idx.push(labelCount===1?0:Math.round(j*(data.length-1)/(labelCount-1)));data.forEach((d,i)=>{ctx.strokeStyle='#52627f';ctx.beginPath();ctx.moveTo(x(i),h-pad.b+2);ctx.lineTo(x(i),h-pad.b+7);ctx.stroke();if(idx.includes(i))ctx.fillText(d.label,x(i),h-13)});drawSeries('a','#7c9cff',.16);drawSeries('b','#b388ff',.12);function drawSeries(key,color,alpha){const pts=data.map((d,i)=>({x:x(i),y:y(d[key]),v:d[key]}));const grad=ctx.createLinearGradient(0,pad.t,0,h-pad.b);grad.addColorStop(0,color+Math.round(alpha*255).toString(16).padStart(2,'0'));grad.addColorStop(1,color+'00');ctx.beginPath();smoothPath(ctx,pts);ctx.lineTo(pts[pts.length-1].x,h-pad.b);ctx.lineTo(pts[0].x,h-pad.b);ctx.closePath();ctx.fillStyle=grad;ctx.fill();ctx.beginPath();smoothPath(ctx,pts);ctx.strokeStyle=color;ctx.lineWidth=2.6;ctx.stroke();pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,3.6,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()})}}
function updateProfitLabel(){$('profitInputLabel').textContent=$('writer').value+' 수익금'}
function addEntry(){const amount=Number($('personalGain').value||0),name=$('writer').value;if(!amount){alert('수익 또는 손실 금액을 입력해주세요.');return}entries.push({date:$('entryDate').value||todayStr(),writer:name,gainA:name==='허성은'?amount:0,gainB:name==='김도영'?amount:0,memo:$('memo').value.trim(),seed:false,createdAt:Date.now()});save();$('personalGain').value='';$('memo').value='';render()}
function resetApp(){if(confirm('초기 수익 데이터로 되돌릴까요?')){entries=seedEntries();save();render()}}
$('entryDate').value=todayStr();entries=load();save();updateProfitLabel();render();window.addEventListener('resize',drawChart);
</script></body></html>
