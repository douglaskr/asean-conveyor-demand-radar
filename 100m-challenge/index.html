<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>우리 둘이 각자 1억 만들기</title>
<style>
:root{--bg:#07101f;--card:#121c30;--card2:#18263f;--text:#f8faff;--muted:#9caac0;--line:#2a3a59;--good:#4bd69b;--warn:#ffd166;--accent:#7c9cff;--accent2:#b388ff;--danger:#ff6f86;--shadow:0 12px 30px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(124,156,255,.20),transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:18px 15px 100px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.eyebrow{font-size:11px;color:var(--accent);font-weight:900;letter-spacing:.1em}h1{font-size:27px;line-height:1.2;margin:5px 0}.sub{font-size:13px;color:var(--muted);line-height:1.5}.sync{padding:8px 10px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap;border:1px solid}.online{color:var(--good);background:rgba(75,214,155,.12);border-color:rgba(75,214,155,.28)}.card{background:linear-gradient(145deg,rgba(24,38,63,.96),rgba(14,25,44,.96));border:1px solid rgba(124,156,255,.16);border-radius:24px;padding:20px;margin:13px 0;box-shadow:var(--shadow)}.personCard{position:relative;overflow:hidden}.personCard:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-70px;top:-75px;background:rgba(124,156,255,.10)}.name{font-size:22px;font-weight:900}.amount{font-size:35px;font-weight:950;letter-spacing:-.04em;margin:8px 0}.label{font-size:13px;color:var(--muted)}.good{color:var(--good)}.warn{color:var(--warn)}.progress{height:12px;background:#07101f;border-radius:99px;overflow:hidden;margin:14px 0 8px;border:1px solid var(--line)}.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.4s}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.meta{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:rgba(7,16,31,.42);padding:13px;border-radius:16px;border:1px solid var(--line)}.metric strong{display:block;font-size:17px;margin-top:7px}.sectionTitle{font-size:20px;font-weight:900;margin-bottom:15px}.inputGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:13px;margin:0 0 7px 3px}input,select{width:100%;padding:15px 14px;border-radius:16px;border:1px solid var(--line);background:#081222;color:var(--text);font:inherit;font-size:16px;outline:none}input:focus,select:focus{border-color:var(--accent)}button{width:100%;border:0;border-radius:17px;padding:16px;font:inherit;font-weight:900;font-size:16px;cursor:pointer}.primary{color:white;background:linear-gradient(100deg,var(--accent),var(--accent2));margin-top:16px}.secondary{color:var(--text);background:var(--card2);border:1px solid var(--line);margin-top:10px}.note{font-size:12px;line-height:1.55;color:var(--muted);margin-top:13px}.chartBox{height:280px;position:relative}.legend{display:flex;gap:15px;font-size:12px;color:var(--muted);margin-bottom:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.dotA{background:#7c9cff}.dotB{background:#b388ff}canvas{width:100%;height:100%;display:block}.item{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.date{font-size:13px;font-weight:800}.detail{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}.gain{font-size:15px;font-weight:900;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:20px 0}@media(max-width:430px){.wrap{padding-left:12px;padding-right:12px}.card{padding:17px;border-radius:21px}.amount{font-size:31px}.grid{gap:8px}.metric{padding:11px}.metric strong{font-size:15px}.chartBox{height:245px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="eyebrow">SEPARATE 100M CHALLENGE</div><h1>우리 둘이 각자 1억 만들기</h1><div class="sub">자산·수익·목표는 합산하지 않고 각자 계산합니다.</div></div><div id="syncBadge" class="sync online">이 기기에 저장</div></div>
<section class="card personCard"><div class="name">허성은</div><div id="balanceA" class="amount">₩0</div><div id="profitA" class="label good">누적수익 ₩0</div><div class="progress"><div id="barA" class="bar"></div></div><div class="row meta"><span id="progressA">0%</span><span id="remainA">남은 금액 ₩0</span></div><div class="grid" style="margin-top:13px"><div class="metric"><span class="label">남은 거래일</span><strong id="daysA" class="warn">-</strong></div><div class="metric"><span class="label">예상 달성일</span><strong id="dateA">-</strong></div></div></section>
<section class="card personCard"><div class="name">김도영</div><div id="balanceB" class="amount">₩0</div><div id="profitB" class="label good">누적수익 ₩0</div><div class="progress"><div id="barB" class="bar"></div></div><div class="row meta"><span id="progressB">0%</span><span id="remainB">남은 금액 ₩0</span></div><div class="grid" style="margin-top:13px"><div class="metric"><span class="label">남은 거래일</span><strong id="daysB" class="warn">-</strong></div><div class="metric"><span class="label">예상 달성일</span><strong id="dateB">-</strong></div></div></section>
<section class="card"><div class="sectionTitle">오늘 수익 입력</div><div class="inputGrid"><div class="field"><label>입력자</label><select id="writer" onchange="updateProfitLabel()"><option value="허성은">허성은</option><option value="김도영" selected>김도영</option></select></div><div class="field"><label>날짜</label><input type="date" id="entryDate"></div></div><div class="field" style="margin-top:10px"><label id="profitInputLabel">김도영 수익금</label><input type="number" id="personalGain" inputmode="numeric" placeholder="예: 40000"></div><div class="field" style="margin-top:10px"><label>메모</label><input id="memo" placeholder="예: 인버스 한화오션"></div><button type="button" class="primary" onclick="addEntry()">내 기록에 추가</button><button type="button" class="secondary" onclick="refreshNow()">새로고침</button><div class="note">선택한 사람에게만 반영됩니다. 손실은 <b>-40000</b>처럼 음수로 입력하세요.</div></section>
<section class="card"><div class="sectionTitle">일별 수익 그래프</div><div class="legend"><span><i class="dot dotA"></i>허성은</span><span><i class="dot dotB"></i>김도영</span></div><div class="chartBox"><canvas id="dailyChart"></canvas></div><div class="note">같은 날짜에 여러 번 입력하면 날짜별로 합산되어 표시됩니다. 최근 14일 기준입니다.</div></section>
<section class="card"><div class="sectionTitle">개별 업데이트 기록</div><div id="history"></div></section>
</div>
<script>
const GOAL=100000000,INITIAL_A=2000000,INITIAL_B=2000000,INITIAL_PROFIT_A=100000,INITIAL_PROFIT_B=130000,DAILY_RATE=.02,LOCAL_KEY="shared100m_fallback_v1";let entries=[];const $=id=>document.getElementById(id);function todayStr(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}function won(v){const s=v<0?"-":"";return s+"₩"+Math.abs(Math.round(v)).toLocaleString("ko-KR")}function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function loadLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]")}catch{return []}}function saveLocal(){localStorage.setItem(LOCAL_KEY,JSON.stringify(entries))}function days(current){if(current>=GOAL)return 0;if(current<=0)return Infinity;return Math.ceil(Math.log(GOAL/current)/Math.log(1+DAILY_RATE))}function addBiz(start,n){const d=new Date(start);let a=0;while(a<n){d.setDate(d.getDate()+1);if(![0,6].includes(d.getDay()))a++}return d}function totals(){const addedA=entries.reduce((s,e)=>s+Number(e.gainA||0),0),addedB=entries.reduce((s,e)=>s+Number(e.gainB||0),0),pA=INITIAL_PROFIT_A+addedA,pB=INITIAL_PROFIT_B+addedB;return{pA,pB,bA:INITIAL_A+pA,bB:INITIAL_B+pB}}function setPerson(suffix,balance,profit){const d=days(balance),p=Math.min(100,balance/GOAL*100);$("balance"+suffix).textContent=won(balance);$("profit"+suffix).textContent="누적수익 "+won(profit);$("bar"+suffix).style.width=p+"%";$("progress"+suffix).textContent=p.toFixed(2)+"% 달성";$("remain"+suffix).textContent="남은 금액 "+won(Math.max(0,GOAL-balance));$("days"+suffix).textContent=isFinite(d)?d+"일":"계산 불가";$("date"+suffix).textContent=isFinite(d)?addBiz(new Date(),d).toLocaleDateString("ko-KR",{year:"2-digit",month:"2-digit",day:"2-digit"}):"-"}function render(){const t=totals();setPerson("A",t.bA,t.pA);setPerson("B",t.bB,t.pB);renderHistory();drawChart()}function renderHistory(){const sorted=[...entries].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||Number(b.createdAt||0)-Number(a.createdAt||0));$("history").innerHTML=sorted.length?sorted.map(e=>{const isA=Number(e.gainA||0)!==0,name=isA?"허성은":"김도영",amount=isA?Number(e.gainA):Number(e.gainB);return `<div class="item"><div><div class="date">${escapeHtml(e.date)} · ${name}</div><div class="detail">${e.memo?escapeHtml(e.memo):"메모 없음"}</div></div><div class="gain" style="${amount<0?"color:var(--danger)":"color:var(--good)"}">${won(amount)}</div></div>`}).join(""):'<div class="empty">아직 입력된 기록이 없습니다.</div>'}function chartData(){const map={};entries.forEach(e=>{const date=e.date||todayStr();if(!map[date])map[date]={date,a:0,b:0};map[date].a+=Number(e.gainA||0);map[date].b+=Number(e.gainB||0)});return Object.values(map).sort((x,y)=>x.date.localeCompare(y.date)).slice(-14)}function drawChart(){const canvas=$("dailyChart"),box=canvas.parentElement,dpr=window.devicePixelRatio||1,w=box.clientWidth,h=box.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+"px";canvas.style.height=h+"px";const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const data=chartData(),pad={l:48,r:12,t:16,b:38},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;ctx.font="11px -apple-system, sans-serif";ctx.lineWidth=1;if(!data.length){ctx.fillStyle="#9caac0";ctx.textAlign="center";ctx.fillText("수익을 입력하면 그래프가 표시됩니다.",w/2,h/2);return}const vals=data.flatMap(d=>[d.a,d.b,0]),max=Math.max(...vals),min=Math.min(...vals);let range=max-min;if(range===0)range=Math.max(1,Math.abs(max));const extra=range*.15,yMax=max+extra,yMin=min-extra,y=v=>pad.t+(yMax-v)/(yMax-yMin)*ch,x=i=>pad.l+(data.length===1?cw/2:i*cw/(data.length-1));ctx.strokeStyle="#2a3a59";ctx.fillStyle="#9caac0";ctx.textAlign="right";for(let i=0;i<=4;i++){const yy=pad.t+i*ch/4,val=yMax-i*(yMax-yMin)/4;ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();ctx.fillText(formatAxis(val),pad.l-7,yy+4)}if(yMin<0&&yMax>0){ctx.strokeStyle="#64748b";ctx.beginPath();ctx.moveTo(pad.l,y(0));ctx.lineTo(w-pad.r,y(0));ctx.stroke()}const step=Math.max(1,Math.ceil(data.length/5));ctx.textAlign="center";ctx.fillStyle="#9caac0";data.forEach((d,i)=>{if(i%step===0||i===data.length-1)ctx.fillText(d.date.slice(5).replace("-","/"),x(i),h-12)});drawLine("a","#7c9cff");drawLine("b","#b388ff");function drawLine(key,color){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2.5;ctx.beginPath();data.forEach((d,i)=>{const xx=x(i),yy=y(d[key]);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke();data.forEach((d,i)=>{ctx.beginPath();ctx.arc(x(i),y(d[key]),3.5,0,Math.PI*2);ctx.fill()})}}function formatAxis(v){const a=Math.abs(v),s=v<0?"-":"";if(a>=1000000)return s+(a/1000000).toFixed(a>=10000000?0:1)+"M";if(a>=1000)return s+Math.round(a/1000)+"K";return s+Math.round(a)}function updateProfitLabel(){const name=$("writer").value;$("profitInputLabel").textContent=name+" 수익금";$("personalGain").placeholder=name==="김도영"?"예: 40000":"예: 100000"}function addEntry(){const amount=Number($("personalGain").value||0),name=$("writer").value;if(amount===0){alert("수익 또는 손실 금액을 입력해주세요.");return}entries.push({date:$("entryDate").value||todayStr(),writer:name,gainA:name==="허성은"?amount:0,gainB:name==="김도영"?amount:0,memo:$("memo").value.trim(),createdAt:Date.now()});saveLocal();render();$("personalGain").value="";$("memo").value=""}function refreshNow(){entries=loadLocal();render()}window.addEntry=addEntry;window.refreshNow=refreshNow;window.updateProfitLabel=updateProfitLabel;$("entryDate").value=todayStr();updateProfitLabel();window.addEventListener("resize",drawChart);entries=loadLocal();render();
</script>
</body>
</html>
