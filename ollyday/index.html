<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#dff4e9" />
  <title>OllyDay</title>
  <style>
    :root{--bg1:#dff4e9;--bg2:#f7f1d8;--hill1:#add8a5;--hill2:#8fc58c;--card:#fffdf7;--main:#4f8a5b;--soft:#e5f4e4;--text:#284336;--muted:#769083;--olly:#ff7f9f;--douglas:#6687ff;--together:#42bd71;--shadow:0 12px 30px rgba(58,94,72,.14)}
    *{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:linear-gradient(var(--bg1),var(--bg2) 76%);overflow-x:hidden;transition:background .4s}
    body.spring{--bg1:#f8dfe9;--bg2:#f7f2d9;--hill1:#b8dca9;--hill2:#91c98d;--main:#61975f;--soft:#edf7e8}
    body.summer{--bg1:#cceef3;--bg2:#e9f5d0;--hill1:#91ce87;--hill2:#65ae72;--main:#397f54;--soft:#e0f3e4}
    body.autumn{--bg1:#f5d6a8;--bg2:#f4e5c3;--hill1:#d6a65d;--hill2:#b97845;--main:#9b5f38;--soft:#f7e4ca}
    body.winter{--bg1:#dcecf8;--bg2:#f7fbff;--hill1:#dbe9ee;--hill2:#c3d9df;--main:#5c7f9e;--soft:#e9f3f8}
    .hill{position:fixed;left:-10%;right:-10%;bottom:-12vh;height:31vh;background:var(--hill1);border-radius:50% 50% 0 0/35% 35% 0 0;z-index:-3;transition:.4s}.hill:after{content:"";position:absolute;left:34%;right:-10%;bottom:0;height:24vh;background:var(--hill2);border-radius:50% 0 0 0}
    .decor{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}.float{position:absolute;animation:drift linear infinite;opacity:.8}.float:nth-child(1){left:8%;animation-duration:13s}.float:nth-child(2){left:28%;animation-duration:17s;animation-delay:-5s}.float:nth-child(3){left:56%;animation-duration:15s;animation-delay:-8s}.float:nth-child(4){left:82%;animation-duration:18s;animation-delay:-3s}@keyframes drift{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(320deg)}}
    .app{max-width:760px;margin:auto;padding:18px 14px 108px;position:relative}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}.brand h1{margin:0;font-size:31px;letter-spacing:-1px}.brand p{margin:4px 0 0;color:var(--muted);font-weight:700}.pill{border:0;background:rgba(255,253,247,.92);border-radius:17px;padding:10px 13px;box-shadow:var(--shadow);font-weight:900;color:var(--text)}
    .hero{background:linear-gradient(135deg,rgba(255,253,247,.97),rgba(250,255,244,.95));border:2px solid rgba(255,255,255,.8);border-radius:27px;padding:18px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer}.hero .small{font-size:13px;color:var(--muted);font-weight:800}.hero .big{font-size:31px;font-weight:950;margin:3px 0}.mascot{font-size:55px;filter:drop-shadow(0 7px 8px rgba(44,91,51,.16))}
    .toolbar{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:13px}.search{border:0;background:rgba(255,253,247,.94);box-shadow:var(--shadow);border-radius:17px;padding:12px 14px;font-size:15px;color:var(--text);min-width:0}.iconbtn{border:0;background:rgba(255,253,247,.94);box-shadow:var(--shadow);border-radius:17px;width:48px;font-size:20px}
    .legend{display:flex;gap:7px;flex-wrap:wrap;margin:12px 2px}.chip{background:rgba(255,253,247,.9);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.olly{background:var(--olly)}.douglas{background:var(--douglas)}.together{background:var(--together)}
    .card{background:rgba(255,253,247,.96);border-radius:25px;padding:15px;box-shadow:var(--shadow);margin-top:13px}.cal-head{display:flex;justify-content:space-between;align-items:center}.cal-head h2{margin:0;font-size:21px}.nav{border:0;background:var(--soft);width:38px;height:38px;border-radius:14px;font-size:21px;color:var(--main);font-weight:950}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week{margin-top:14px;color:var(--muted);text-align:center;font-size:11px;font-weight:900}.grid{margin-top:7px}.day{min-height:65px;border:0;background:#f8fbf4;border-radius:15px;padding:7px 3px;position:relative;color:var(--text);font-weight:900}.winter .day{background:#f6fbfd}.autumn .day{background:#fcf6ea}.day.empty{opacity:0}.day.today{outline:3px solid #ffe27a;background:#fffbed}.day.selected{outline:3px solid var(--main);transform:translateY(-1px)}.num{font-size:13px}.marks{display:flex;justify-content:center;gap:3px;margin-top:8px;flex-wrap:wrap}.mark{width:7px;height:7px;border-radius:50%}
    .section-title{display:flex;justify-content:space-between;align-items:center}.section-title h3{margin:0;font-size:18px}.empty-msg{text-align:center;color:var(--muted);padding:21px 0;font-weight:800}.event{display:flex;gap:10px;align-items:flex-start;padding:12px;margin-top:9px;background:#f7faf5;border-radius:18px;border-left:6px solid}.event.olly-border{border-color:var(--olly)}.event.douglas-border{border-color:var(--douglas)}.event.together-border{border-color:var(--together)}.event-main{flex:1;min-width:0}.event-title{font-weight:950;word-break:break-word}.event-meta{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-word}.edit{border:0;background:transparent;font-size:16px}
    .fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:22px;width:61px;height:61px;border-radius:21px;border:0;background:var(--main);color:#fff;font-size:33px;box-shadow:0 14px 30px rgba(58,94,72,.35);z-index:5;transition:.2s}.fab:active{transform:scale(.92)}
    .modal{position:fixed;inset:0;background:rgba(33,55,42,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}.sheet{background:var(--card);width:min(760px,100%);border-radius:27px 27px 0 0;padding:19px 17px calc(23px + env(safe-area-inset-bottom));max-height:89vh;overflow:auto}.sheet h3{margin:0 0 15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px;color:var(--muted)}input,select,textarea{width:100%;border:1.5px solid #dce9dc;background:#fbfdf9;border-radius:14px;padding:12px;font-size:16px;color:var(--text)}textarea{min-height:78px;resize:vertical}.owners{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.owner-btn{border:2px solid transparent;border-radius:15px;padding:10px 5px;font-weight:900;background:#f4f7f2}.owner-btn.active{border-color:var(--main);background:var(--soft)}.actions{display:flex;gap:9px;margin-top:13px}.actions button{flex:1;border:0;border-radius:15px;padding:13px;font-size:15px;font-weight:950}.cancel{background:#edf1ec;color:var(--text)}.save{background:var(--main);color:white}.danger{background:#ffe5e5!important;color:#b83838!important}.sync{margin-top:10px;text-align:center;font-size:11px;color:var(--muted);font-weight:800}.footer{text-align:center;color:#6f8c77;font-size:11px;font-weight:800;margin:17px 0}.hidden{display:none!important}
    @media(max-width:430px){.app{padding:13px 11px 98px}.brand h1{font-size:28px}.hero{padding:16px}.hero .big{font-size:27px}.day{min-height:57px;border-radius:12px}.card{border-radius:21px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="decor" id="decor"></div><div class="hill"></div>
  <main class="app">
    <div class="top"><div class="brand"><h1>🌿 OllyDay</h1><p id="seasonText">우리 둘의 작은 달력</p></div><button class="pill" id="todayBtn">오늘</button></div>
    <section class="hero" id="hero"><div><div class="small">우리의 특별한 날</div><div class="big" id="dday">D-Day 설정</div><div class="small" id="ddayLabel">카드를 눌러 시작일을 정해요</div></div><div class="mascot" id="mascot">🌳</div></section>
    <div class="toolbar"><input class="search" id="search" placeholder="일정 검색 🔎"><button class="iconbtn" id="notifyBtn" title="알림 설정">🔔</button></div>
    <div class="legend"><span class="chip"><i class="dot olly"></i>올리</span><span class="chip"><i class="dot douglas"></i>더글라스</span><span class="chip"><i class="dot together"></i>같이</span></div>
    <section class="card"><div class="cal-head"><button class="nav" id="prev">‹</button><h2 id="monthTitle"></h2><button class="nav" id="next">›</button></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="grid" id="calendar"></div></section>
    <section class="card"><div class="section-title"><h3 id="selectedTitle">오늘 일정</h3><span id="seasonIcon">🌼</span></div><div id="events"></div><div class="sync" id="syncState">기기 저장 모드</div></section>
    <div class="footer">OllyDay · 귀엽고 아기자기한 우리의 하루</div>
  </main>
  <button class="fab" id="addBtn">＋</button>

  <div class="modal" id="eventModal"><div class="sheet"><h3 id="formTitle">새 일정</h3><input type="hidden" id="editId"><div class="field"><label>누구 일정인가요?</label><div class="owners"><button class="owner-btn active" data-owner="olly">🌷 올리</button><button class="owner-btn" data-owner="douglas">🧸 더글라스</button><button class="owner-btn" data-owner="together">💚 같이</button></div></div><div class="field"><label>일정 제목</label><input id="title" placeholder="예: 영화 데이트"></div><div class="row"><div class="field"><label>날짜</label><input id="date" type="date"></div><div class="field"><label>시간</label><input id="time" type="time"></div></div><div class="field"><label>장소</label><input id="place" placeholder="예: 서면"></div><div class="field"><label>알림</label><select id="reminder"><option value="0">없음</option><option value="10">10분 전</option><option value="30">30분 전</option><option value="60">1시간 전</option><option value="1440">하루 전</option></select></div><div class="field"><label>메모</label><textarea id="note" placeholder="기억해둘 내용을 적어주세요"></textarea></div><div class="actions"><button class="cancel" id="cancel">닫기</button><button class="danger hidden" id="delete">삭제</button><button class="save" id="save">저장</button></div></div></div>
  <div class="modal" id="ddayModal"><div class="sheet"><h3>우리의 특별한 날</h3><div class="field"><label>표시 이름</label><input id="ddayName" placeholder="예: 함께한 날"></div><div class="field"><label>시작일</label><input id="ddayDate" type="date"></div><div class="actions"><button class="cancel" id="ddayCancel">닫기</button><button class="save" id="ddaySave">저장</button></div></div></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig={apiKey:'AIzaSyAlTTJG-akfZYXMzGJdPmbz4HXOfa-Ro2w',authDomain:'eokeogi.firebaseapp.com',projectId:'eokeogi',storageBucket:'eokeogi.firebasestorage.app',messagingSenderId:'268722870371',appId:'1:268722870371:web:6f718993fc1cc3292b0056'};
  const LOCAL_KEY='ollyday-events-v2', LOCAL_DDAY='ollyday-dday-v2';
  let db=null, cloud=false, events=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');
  let view=new Date(), selected=ymd(new Date()), owner='olly', searchTerm='';
  const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
  function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

  function applySeason(){const m=new Date().getMonth()+1;let s='spring',icon='🌸',mascot='🌸',text='포근한 봄날의 우리';if(m>=6&&m<=8){s='summer';icon='🌻';mascot='🌳';text='초록빛 여름의 우리'}else if(m>=9&&m<=11){s='autumn';icon='🍁';mascot='🍄';text='도토리 가득한 가을의 우리'}else if(m===12||m<=2){s='winter';icon='❄️';mascot='⛄';text='포근포근 겨울의 우리'}document.body.className=s;$('#seasonIcon').textContent=icon;$('#mascot').textContent=mascot;$('#seasonText').textContent=text;const deco={spring:['🌸','🌼','🌸','🌷'],summer:['☁️','🦋','☁️','🌿'],autumn:['🍂','🍁','🍂','🌰'],winter:['❄️','✦','❄️','☃️']}[s];$('#decor').innerHTML=deco.map((x,i)=>`<span class="float" style="font-size:${18+i*3}px">${x}</span>`).join('')}

  async function initCloud(){try{const app=initializeApp(firebaseConfig);db=getFirestore(app);onSnapshot(collection(db,'ollyday_events'),snap=>{events=snap.docs.map(d=>({id:d.id,...d.data()}));cloud=true;$('#syncState').textContent='☁️ 두 사람 실시간 동기화 중';render()},()=>fallback());const d=await getDoc(doc(db,'ollyday_settings','dday'));if(d.exists())localStorage.setItem(LOCAL_DDAY,JSON.stringify(d.data()));cloud=true;renderDday()}catch(e){fallback()}}
  function fallback(){cloud=false;$('#syncState').textContent='📱 현재 기기에 저장 중';events=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');render()}
  function localSave(){localStorage.setItem(LOCAL_KEY,JSON.stringify(events));render()}

  function render(){renderCalendar();renderEvents();renderDday()}
  function renderCalendar(){const y=view.getFullYear(),m=view.getMonth();$('#monthTitle').textContent=`${y}년 ${m+1}월`;const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let html='';for(let i=0;i<first;i++)html+='<button class="day empty"></button>';for(let d=1;d<=last;d++){const date=ymd(new Date(y,m,d));const es=events.filter(e=>e.date===date);const marks=es.slice(0,6).map(e=>`<i class="mark ${e.owner}"></i>`).join('');html+=`<button class="day ${date===ymd(new Date())?'today':''} ${date===selected?'selected':''}" data-date="${date}"><div class="num">${d}</div><div class="marks">${marks}</div></button>`}$('#calendar').innerHTML=html;$$('.day[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()})}
  function filtered(){const q=searchTerm.toLowerCase();return events.filter(e=>!q||[e.title,e.place,e.note].some(v=>String(v||'').toLowerCase().includes(q)))}
  function renderEvents(){let list=filtered();if(!searchTerm)list=list.filter(e=>e.date===selected);list.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const d=new Date(selected+'T00:00:00');$('#selectedTitle').textContent=searchTerm?`검색 결과 ${list.length}개`:d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'})+' 일정';if(!list.length){$('#events').innerHTML='<div class="empty-msg">🌼<br>아직 일정이 없어요</div>';return}$('#events').innerHTML=list.map(e=>`<div class="event ${e.owner}-border"><div>${e.owner==='olly'?'🌷':e.owner==='douglas'?'🧸':'💚'}</div><div class="event-main"><div class="event-title">${esc(e.title)}</div><div class="event-meta">${searchTerm?esc(e.date)+' · ':''}${e.time?esc(e.time)+' · ':''}${esc(e.place||'장소 미정')}</div>${e.note?`<div class="event-meta">${esc(e.note)}</div>`:''}</div><button class="edit" data-edit="${e.id}">✏️</button></div>`).join('');$$('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit))}

  function resetForm(){$('#formTitle').textContent='새 일정';$('#editId').value='';$('#title').value='';$('#time').value='';$('#place').value='';$('#note').value='';$('#reminder').value='0';$('#delete').classList.add('hidden');setOwner('olly')}
  function setOwner(v){owner=v;$$('.owner-btn').forEach(b=>b.classList.toggle('active',b.dataset.owner===v))}
  function openNew(){resetForm();$('#date').value=selected;$('#eventModal').classList.add('show')}
  function openEdit(id){const e=events.find(x=>x.id===id);if(!e)return;$('#formTitle').textContent='일정 수정';$('#editId').value=e.id;$('#title').value=e.title||'';$('#date').value=e.date||'';$('#time').value=e.time||'';$('#place').value=e.place||'';$('#note').value=e.note||'';$('#reminder').value=String(e.reminder||0);$('#delete').classList.remove('hidden');setOwner(e.owner||'olly');$('#eventModal').classList.add('show')}
  async function saveEvent(){const title=$('#title').value.trim(),date=$('#date').value;if(!title||!date){alert('일정 제목과 날짜를 입력해주세요.');return}const id=$('#editId').value,item={title,date,time:$('#time').value,place:$('#place').value.trim(),note:$('#note').value.trim(),reminder:Number($('#reminder').value),owner,updatedAt:Date.now()};try{if(cloud){if(id)await updateDoc(doc(db,'ollyday_events',id),item);else await addDoc(collection(db,'ollyday_events'),{...item,createdAt:serverTimestamp()})}else{if(id)events=events.map(e=>e.id===id?{...item,id}:e);else events.push({...item,id:String(Date.now())});localSave()}selected=date;$('#eventModal').classList.remove('show');scheduleLocalNotifications()}catch(e){alert('저장에 실패했습니다. 잠시 후 다시 시도해주세요.') }}
  async function deleteEvent(){const id=$('#editId').value;if(!confirm('이 일정을 삭제할까요?'))return;try{if(cloud)await deleteDoc(doc(db,'ollyday_events',id));else{events=events.filter(e=>e.id!==id);localSave()}$('#eventModal').classList.remove('show')}catch(e){alert('삭제에 실패했습니다.')}}

  async function enableNotifications(){if(!('Notification'in window)){alert('이 브라우저는 알림을 지원하지 않습니다.');return}const p=await Notification.requestPermission();if(p==='granted'){new Notification('OllyDay 알림 켜짐 🌼',{body:'일정 시간이 가까워지면 알려드릴게요.'});scheduleLocalNotifications()}else alert('브라우저 설정에서 알림을 허용해주세요.')}
  function scheduleLocalNotifications(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=Date.now();events.forEach(e=>{if(!e.reminder||!e.time)return;const t=new Date(`${e.date}T${e.time}:00`).getTime()-e.reminder*60000;const wait=t-now;if(wait>0&&wait<2147483647)setTimeout(()=>new Notification(`OllyDay · ${e.title}`,{body:`${e.time} ${e.place||''}`}),wait)})}

  function renderDday(){const d=JSON.parse(localStorage.getItem(LOCAL_DDAY)||'{}');if(!d.date){$('#dday').textContent='D-Day 설정';$('#ddayLabel').textContent='카드를 눌러 시작일을 정해요';return}const start=new Date(d.date+'T00:00:00'),now=new Date();now.setHours(0,0,0,0);const diff=Math.floor((now-start)/86400000)+1;$('#dday').textContent=diff>=1?`D+${diff}`:`D${diff}`;$('#ddayLabel').textContent=d.name||'함께한 날'}
  async function saveDday(){const date=$('#ddayDate').value;if(!date){alert('시작일을 입력해주세요.');return}const val={name:$('#ddayName').value.trim()||'함께한 날',date};localStorage.setItem(LOCAL_DDAY,JSON.stringify(val));try{if(cloud)await setDoc(doc(db,'ollyday_settings','dday'),val)}catch(e){}$('#ddayModal').classList.remove('show');renderDday()}

  $$('.owner-btn').forEach(b=>b.onclick=()=>setOwner(b.dataset.owner));$('#addBtn').onclick=openNew;$('#save').onclick=saveEvent;$('#delete').onclick=deleteEvent;$('#cancel').onclick=()=>$('#eventModal').classList.remove('show');$('#eventModal').onclick=e=>{if(e.target.id==='eventModal')e.currentTarget.classList.remove('show')};
  $('#prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('#next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('#todayBtn').onclick=()=>{view=new Date();selected=ymd(new Date());searchTerm='';$('#search').value='';render()};$('#search').oninput=e=>{searchTerm=e.target.value.trim();renderEvents()};$('#notifyBtn').onclick=enableNotifications;
  $('#hero').onclick=()=>{const d=JSON.parse(localStorage.getItem(LOCAL_DDAY)||'{}');$('#ddayName').value=d.name||'함께한 날';$('#ddayDate').value=d.date||'';$('#ddayModal').classList.add('show')};$('#ddayCancel').onclick=()=>$('#ddayModal').classList.remove('show');$('#ddaySave').onclick=saveDday;
  applySeason();render();initCloud();scheduleLocalNotifications();
</script>
</body>
</html>
